name: Deploy to OVH

# Builds the Astro site and pushes dist/ to the OVH mutualisé host over
# SFTP — see instructions/CLAUDE EXECUTION PLAN — gnegreiros.md §11.
# OVH mutualisé SFTP is a jailed account (no shell/rsync).
#
# The deploy step uses a custom script (scripts/deploy-sftp.mjs) instead of
# a plain SFTP put action: the OVH SFTP session reproducibly hits a ~25s
# dead window partway through the upload (same files truncated every run),
# so each file's remote size is verified after upload and retried
# (reconnecting) on mismatch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # npm ci: the committed lockfile's optional wasm32-wasi fallback
      # entries (rolldown/lightningcss deps) resolve differently on macOS
      # vs. this Linux runner, so npm ci flags them as "missing" even
      # though npm install here resolves cleanly.
      - run: npm install
      - run: npm run build

      - name: Deploy over SFTP
        env:
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
        run: node scripts/deploy-sftp.mjs
