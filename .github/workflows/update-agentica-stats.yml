name: Update Agentica stats

# Refreshes src/data/agentica-stats.json from the live GitHub repo, once a
# month — see instructions/CLAUDE EXECUTION PLAN — gnegreiros.md §8.
# astro build/dev never call the GitHub API themselves; they only read this
# committed file, so the site's normal push-triggered builds stay
# decoupled from this external dependency and its rate limit.

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: node scripts/update-agentica-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/agentica-stats.json
          git diff --cached --quiet || git commit -m "chore: refresh Agentica stats"
          git diff --cached --quiet || git push
